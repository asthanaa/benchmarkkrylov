[ccik_generator_keep]
type: integer
doc: Minimum number of largest determinants in q_k used as generators.
interface: ezfio,provider,ocaml
default: 256

[ccik_generator_fraction]
type: double precision
doc: If > 0, adaptively increase the generator set until this cumulative norm fraction is captured.
interface: ezfio,provider,ocaml
default: 0.

[ccik_generator_abs_coeff_cutoff]
type: double precision
doc: Drop generator parents with absolute coefficient below this threshold before expansion.
interface: ezfio,provider,ocaml
default: 0.

[ccik_max_parents_for_expansion]
type: integer
doc: Optional hard cap applied after generator_keep/fraction filtering. Set <= 0 to disable.
interface: ezfio,provider,ocaml
default: 0

[ccik_include_current_support]
type: logical
doc: Preserve the current q_k support in projected-matvec selection/compression whenever possible.
interface: ezfio,provider,ocaml
default: True

[ccik_selector_keep]
type: integer
doc: Number of largest determinants in q_k used as selectors.
interface: ezfio,provider,ocaml
default: 2048

[ccik_external_keep]
type: integer
doc: Maximum number of external determinants retained in the projected Hq build.
interface: ezfio,provider,ocaml
default: 20000

[ccik_external_candidate_factor]
type: integer
doc: Oversampling factor for external candidate discovery before projected-amplitude reranking.
interface: ezfio,provider,ocaml
default: 4

[ccik_pt2_rank_weight]
type: double precision
doc: Weight of the PT2-style selection score when hybrid-ranking external determinants for projected Hq.
interface: ezfio,provider,ocaml
default: 1.

[ccik_selector_mode]
type: character*(32)
doc: Projected-matvec selector mode: abs_hq, sq_hq, abs_residual, sq_residual, or pt2_residual (pt2_legacy remains an alias).
interface: ezfio,provider,ocaml
default: abs_residual

[ccik_matvec_backend]
type: character*(32)
doc: Projected-matvec backend: legacy_pt2 or connected_sd_fullq.
interface: ezfio,provider,ocaml
default: connected_sd_fullq

[ccik_compression_policy]
type: character*(32)
doc: Compression policy for Krylov vectors and propagation support: topk, threshold, or fixed_budget.
interface: ezfio,provider,ocaml
default: topk

[ccik_fixed_store_keep]
type: integer
doc: Top-K storage cap used for Krylov, restart, and final Ritz vectors when ccik_compression_policy=fixed_budget.
interface: ezfio,provider,ocaml
default: 65536

[ccik_fixed_propagate_keep]
type: integer
doc: Top-K propagation support size used when ccik_compression_policy=fixed_budget.
interface: ezfio,provider,ocaml
default: 512

[ccik_secondortho]
type: logical
doc: Optional support-restricted reorthogonalization after fixed-budget Kstore selection.
interface: ezfio,provider,ocaml
default: False

[ccik_store_abs_tol]
type: double precision
doc: Absolute threshold for storing normalized Krylov-vector coefficients when ccik_compression_policy=threshold.
interface: ezfio,provider,ocaml
default: 0.

[ccik_propagate_abs_tol]
type: double precision
doc: Absolute threshold for using normalized q_k coefficients in Hq propagation when ccik_compression_policy=threshold.
interface: ezfio,provider,ocaml
default: 0.

[ccik_nkeep]
type: integer
doc: Maximum number of determinants retained in each compressed Krylov vector.
interface: ezfio,provider,ocaml
default: 100000

[ccik_tmp_keep_factor]
type: integer
doc: Oversampling factor used before the final post-orthogonalization compression.
interface: ezfio,provider,ocaml
default: 4

[ccik_preserve_prev_support]
type: logical
doc: Preserve a capped subset of the previous q_k support during the final compression.
interface: ezfio,provider,ocaml
default: True

[ccik_preserve_prev_support_cap]
type: integer
doc: Maximum number of previous-support determinants to preserve. Set <= 0 for runtime default min(2048,nkeep/4).
interface: ezfio,provider,ocaml
default: 0

[ccik_total_det_budget]
type: integer
doc: Total determinant storage budget for thick-restart ccik. If > 0, thick-restart derives its effective nkeep from this budget.
interface: ezfio,provider,ocaml
default: 0

[ccik_basis_size]
type: integer
doc: Maximum Krylov dimension for baseline unrestarted ccik.
interface: ezfio,provider,ocaml
default: 32

[ccik_conv_tol]
type: double precision
doc: Energy convergence threshold for the baseline ccik Krylov solve.
interface: ezfio,provider,ocaml
default: 1.e-6

[ccik_ritz_overlap_tol]
type: double precision
doc: Relative overlap-eigenvalue threshold used to filter ill-conditioned Ritz directions.
interface: ezfio,provider,ocaml
default: 1.e-8

[ccik_ritz_max_drop]
type: double precision
doc: Maximum allowed Ritz drop below the best diagonal projected energy before falling back to the diagonal basis. Set <= 0 to disable.
interface: ezfio,provider,ocaml
default: 0.

[ccik_save_final_wf]
type: logical
doc: Save the final lowest Ritz vector back into the EZFIO wavefunction so PT2/orbital optimization can reuse it.
interface: ezfio,provider,ocaml
default: True

[ccik_use_existing_wf]
type: logical
doc: Initialize CCIK from the current EZFIO wavefunction instead of forcing a single-determinant Hartree-Fock restart.
interface: ezfio,provider,ocaml
default: False

[ccik_do_post_pt2]
type: logical
doc: Compute and print a deterministic PT2-like correction on the final saved CCIK wavefunction.
interface: ezfio,provider,ocaml
default: False

[ccik_max_cycle]
type: integer
doc: Number of outer cycles for thick-restart ccik. Baseline ccik ignores this when restart is disabled.
interface: ezfio,provider,ocaml
default: 1

[ccik_restart_m_cycle]
type: integer
doc: Active Krylov dimension used in each thick-restart cycle. Set <= 0 to disable restart mode.
interface: ezfio,provider,ocaml
default: 0

[ccik_restart_nroot]
type: integer
doc: Number of lowest Ritz vectors retained between thick-restart cycles.
interface: ezfio,provider,ocaml
default: 2

[ccik_exactized_checkpoint_every]
type: integer
doc: Diagnostic-only exactized checkpoint cadence in cumulative new Krylov additions. Set <= 0 to disable.
interface: ezfio,provider,ocaml
default: 0

[ccik_exactized_resid_tol]
type: double precision
doc: Davidson residual tolerance for exactized determinant-union checkpoints.
interface: ezfio,provider,ocaml
default: 1.e-10

[ccik_exactized_max_iter]
type: integer
doc: Maximum Davidson outer iterations for exactized determinant-union checkpoints.
interface: ezfio,provider,ocaml
default: 200

[ccik_exactized_max_subspace]
type: integer
doc: Maximum Davidson subspace size for exactized determinant-union checkpoints.
interface: ezfio,provider,ocaml
default: 24

[ccik_exactized_restart_keep]
type: integer
doc: Number of lowest projected Davidson directions retained at exactized-checkpoint restart.
interface: ezfio,provider,ocaml
default: 4

[ccik_reference_total_energy]
type: double precision
doc: Optional total-energy reference used only for per-iteration error reporting when ccik_print_iteration_error is enabled.
interface: ezfio,provider,ocaml
default: 0.

[ccik_print_iteration_error]
type: logical
doc: Print the current total energy and delta relative to ccik_reference_total_energy after each Krylov/Ritz update.
interface: ezfio,provider,ocaml
default: False

[ccik_verbose]
type: logical
doc: Emit baseline ccik diagnostics.
interface: ezfio,provider,ocaml
default: False

[ccik_debug_trace]
type: logical
doc: Write detailed per-step trace lines to ccik_debug_trace.log in the current working directory.
interface: ezfio,provider,ocaml
default: False

[ccik_debug_trace_topn]
type: integer
doc: Number of leading coefficients to dump for traced sparse vectors.
interface: ezfio,provider,ocaml
default: 8

[ccik_debug_allow_legacy_fixed_budget]
type: logical
doc: Debug-only override that allows ccik_matvec_backend=legacy_pt2 even when ccik_compression_policy=fixed_budget.
interface: ezfio,provider,ocaml
default: False
