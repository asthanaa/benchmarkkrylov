# Default configuration for the legacy-compatible N2 scan driver

[run]
# Valid method names:
# - "ccik"
# - "ccik_thick"
# - "ccik_stochastic"
methods = ["ccik_thick"]

[molecule]
basis = "6-31g"
unit = "Angstrom"
charge = 0
spin = 0
verbose = 0

[scan]
R_min = 0.8
R_max = 3.0
n_points = 16

[cas]
ncas = 10
nelecas = 10
ncore = 2

[ccik]
m = 250
# Legacy top-k knobs. These are only active when compression_policy = "topk".
nadd = 2000
nkeep = 10000
Kv = 3000
compression_policy = "fixed_budget"
store_abs_tol = 0.0
propagate_abs_tol = 0.0
# Default fixed-budget knobs used by the teaching and benchmark workflows.
fixed_store_keep = 65536
fixed_propagate_keep = 512
candidate_mode = "selected_ci"
projected_ritz_mode = "exact_on_basis"
selector_mode = "abs_residual"
selector_depth = 1
generator_keep = 256
generator_abs_coeff_cutoff = 0.0
max_parents_for_expansion = 256
include_current_support = true
tmp_keep_factor = 4
preserve_prev_support = true
preserve_prev_support_cap = 2048
exact_hq_diagnostics = false
selector_ci_coeff_cutoff = 5e-4
selector_cutoff = 5e-4
orth_tol = 1e-12
verbose = false

[ccik_thick]
m_cycle = 25
ncycles = 10
nroot = 5
tol = 1e-6
# Legacy top-k knobs. These are only active when compression_policy = "topk".
nadd = 2000
nkeep = 10000
Kv = 3000
compression_policy = "fixed_budget"
store_abs_tol = 0.0
propagate_abs_tol = 0.0
# Default fixed-budget knobs used by the teaching and benchmark workflows.
fixed_store_keep = 65536
fixed_propagate_keep = 512
candidate_mode = "selected_ci"
projected_ritz_mode = "exact_on_basis"
selector_mode = "abs_residual"
selector_depth = 1
generator_keep = 256
generator_abs_coeff_cutoff = 0.0
max_parents_for_expansion = 256
include_current_support = true
tmp_keep_factor = 4
preserve_prev_support = true
preserve_prev_support_cap = 2048
exact_hq_diagnostics = false
selector_ci_coeff_cutoff = 5e-4
selector_cutoff = 5e-4
orth_tol = 1e-12
verbose = false

[ccik_stochastic]
m = 100
# Legacy top-k knobs. These are only active when compression_policy = "topk".
nadd = 2000
nkeep = 10000
Kv = 3000
compression_policy = "fixed_budget"
store_abs_tol = 0.0
propagate_abs_tol = 0.0
# Default fixed-budget knobs used by the teaching and benchmark workflows.
fixed_store_keep = 65536
fixed_propagate_keep = 512
candidate_mode = "stochastic"
selector_mode = "abs_residual"
selector_depth = 1
generator_keep = 256
generator_abs_coeff_cutoff = 0.0
max_parents_for_expansion = 256
include_current_support = true
tmp_keep_factor = 4
preserve_prev_support = true
preserve_prev_support_cap = 2048
exact_hq_diagnostics = false
selector_ci_coeff_cutoff = 5e-4
selector_cutoff = 5e-4
n_walkers = 20000
seed = 0
parent_power = 1.0
p_double = 0.6
mixed_double_weight = 1.0
eps_denom = 1e-12
orth_tol = 1e-12
verbose = false
