site_name: "QRTE/QKUD Benchmark"
site_description: "Documentation for the QCANT MolVQE-21 QRTE and QKUD benchmark workspace"
repo_url: "https://github.com/asthanaa/benchmarkkrylov"
repo_name: "asthanaa/benchmarkkrylov"
edit_uri: "edit/main/docs/"

use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Repository Map: repository-map.md
  - Dataset And Manifest: dataset.md
  - Algorithms: algorithms.md
  - Running The Benchmark: running.md
  - Results And Provenance: results.md
